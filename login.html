<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Login - Examify</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2.5rem 2rem;
            text-align: center;
            color: white;
        }

        .login-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.4rem;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .login-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.4rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 0.95rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.75rem 0.75rem 0.75rem 2.5rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #667eea;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            left: auto;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #667eea;
        }

        .forgot-link {
            text-align: right;
            margin-top: -0.8rem;
            margin-bottom: 1.2rem;
        }

        .forgot-link a {
            color: #667eea;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.82rem;
            margin-top: 0.3rem;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .divider {
            text-align: center;
            margin: 1.2rem 0;
            color: #aaa;
            font-size: 0.9rem;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: #e9ecef;
        }

        .divider::before { left: 0; }
        .divider::after  { right: 0; }

        .register-link {
            text-align: center;
            font-size: 0.93rem;
            color: #666;
        }

        .register-link a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #667eea;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            pointer-events: none;
            min-width: 250px;
            text-align: center;
        }

        .toast.show    { opacity: 1; transform: translateY(0); }
        .toast.success { background: #27ae60; }
        .toast.error   { background: #e74c3c; }

        @media (max-width: 480px) {
            .login-card { border-radius: 12px; }
            .login-body { padding: 1.5rem; }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">📚 Examify</div>
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="apply.html">Apply</a>
            <a href="contact.html">Contact Us</a>
            <a href="aboutus.html">About Us</a>
        </div>
        <button class="hamburger" id="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>
    </div>
    <nav class="mobile-nav" id="mobileNav">
        <a href="index.html">Home</a>
        <a href="apply.html">Apply</a>
        <a href="contact.html">Contact Us</a>
        <a href="aboutus.html">About Us</a>
    </nav>

    <!-- Login Card -->
    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-header">
                <h1>👋 Welcome Back</h1>
                <p>Login to your Examify account</p>
            </div>

            <div class="login-body">

                <!-- Email -->
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email">
                    </div>
                    <div class="error-msg" id="emailError">Please enter a valid email address.</div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password">
                        <i class="fa-solid fa-eye toggle-password" id="togglePwd"></i>
                    </div>
                    <div class="error-msg" id="passwordError">Password must be at least 6 characters.</div>
                </div>

                <!-- Forgot password -->
                <div class="forgot-link">
                    <a href="#">Forgot Password?</a>
                </div>

                <!-- Login Button — no form tag, plain button with onclick -->
                <button class="submit-btn" id="loginBtn" onclick="doLogin()">
                    Login
                </button>

                <div class="divider">or</div>

                <div class="register-link">
                    Don't have an account?
                    <a href="register.html">Register here</a>
                </div>

            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>

        // ── Hamburger ──
        function toggleMenu() {
            document.getElementById('hamburger').classList.toggle('open');
            document.getElementById('mobileNav').classList.toggle('open');
        }

        // ── Active nav ──
        document.querySelectorAll('.nav a, .mobile-nav a').forEach(function(link) {
            if (link.href === window.location.href) {
                link.classList.add('active');
            }
        });

        // ── Toast function ──
        function showToast(message, type) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + (type || '');
            setTimeout(function() {
                toast.className = 'toast';
            }, 3000);
        }

        // ── Always create a test user so you can login immediately ──
        // email: test@examify.com | password: test123
        localStorage.setItem('examifyRegistered', JSON.stringify({
            name:     'Test User',
            email:    'test@examify.com',
            password: 'test123',
            phone:    '9999999999'
        }));

        // ── Show / hide password ──
        document.getElementById('togglePwd').addEventListener('click', function() {
            var pwd = document.getElementById('password');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');
            }
        });

        // ── Login function ──
        function doLogin() {
            var email    = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var valid    = true;

            // validate email
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').classList.add('show');
                valid = false;
            } else {
                document.getElementById('emailError').classList.remove('show');
            }

            // validate password
            if (password.length < 6) {
                document.getElementById('passwordError').classList.add('show');
                valid = false;
            } else {
                document.getElementById('passwordError').classList.remove('show');
            }

            if (!valid) return;

            // show loading spinner
            var btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="spinner"></span> Logging in...';
            btn.disabled = true;

            setTimeout(function() {
                var savedStr = localStorage.getItem('examifyRegistered');
                var saved    = savedStr ? JSON.parse(savedStr) : null;

                if (saved && saved.email === email && saved.password === password) {
                    // save session
                    localStorage.setItem('examifyUser', JSON.stringify({
                        name:  saved.name,
                        email: saved.email
                    }));
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    btn.innerHTML = 'Login';
                    btn.disabled  = false;
                    showToast('Incorrect email or password!', 'error');
                }
            }, 1200);
        }

    </script>

</body>
</html>
